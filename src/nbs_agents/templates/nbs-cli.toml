# nbs-agents settings, written by `nbs-agents init` (or a package's init that wraps it).
# Every setting is optional; the commented values are the defaults.
# NBS_<NAME> environment variables override [nbs_cli] settings.

[nbs_cli]
# --- Beamline services
# qs_addr = "tcp://localhost:60615"     # QueueServer 0MQ control address
# qs_user_group = "primary"             # QueueServer group agents submit as
# zmq_addr = "localhost:5578"           # Bluesky document stream
# Tiled server and this beamline's run catalog in it; `nbs-agents init --tiled-uri
# ... --tiled-path ...` fills these in.
# tiled_uri = "http://localhost:8000"
# tiled_path = ""
# Tiled login: nbs-agents-runner logs you in (Entra ID link) when the server needs
# it and keeps a read-only key for agents; see `nbs-agents tiled-login`.
# tiled_key_lifetime_s = 86400          # life of each agent key
# A fixed key instead: TILED_API_KEY in the environment (not here).

[agent_log]
# The agent log's own Redis. By default nbs-agents-runner serves it on 127.0.0.1;
# set host/port/serve = false for one that runs elsewhere.
# port = 60740
# serve = true
# data_dir = ""                         # default state/agent-log under $NBS_AGENTS_HOME
