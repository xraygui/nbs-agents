[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nbs-agents"
authors = [
    {name = "Charles Titus", email = "ctitus@bnl.gov"},
]
requires-python = ">=3.9"
description = "Run beamline agents alongside the Bluesky QueueServer"
dynamic = ["version"]
readme = "README.md"
keywords = ["bluesky", "nsls-ii", "beamline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research"
]
dependencies = [
    "bluesky",
    "bluesky-queueserver",
    "bluesky-queueserver-api",
    "tiled",
    "numpy",
    "ipython",
    "redis",
    "pyzmq",
    'tomli ; python_version < "3.11"'
]

[tool.pixi.dependencies]
bluesky = "*"
bluesky-queueserver = "*"
bluesky-queueserver-api = "*"
tiled = "*"
numpy = "*"
ipython = "*"
redis-py = "*"
pyzmq = "*"
qt6-wayland = "*"
redis-server = ">=8.10.2,<9"

[project.urls]
homepage = "https://github.com/xraygui/nbs-agents"

[project.scripts]
nbs-agents-runner = "nbs_agents.runner:main"
nbs-agents = "nbs_agents.admin:main"
# Claude agents and the beamline assistant (the [assistant] extra)
nbs-cli = "nbs_agents.cli.main:main"
nbs-agents-web = "nbs_agents.web.__main__:main"
nbs-agents-assistant = "nbs_agents.assistant.admin:main"
claude-beamline = "nbs_agents.assistant.resources:claude_beamline"

[project.optional-dependencies]
gui = ["nbs-gui", "qtpy"]
# nbs-cli, the Claude agents, the beamline assistant and its web UI
assistant = ["fastapi", "uvicorn", "matplotlib", "pyyaml", "pyepics"]

# The "claude" agent, the runner plugin (launch hook and assistant) and the
# New agent launcher
[project.entry-points."nbs_agents.agents"]
claude = "nbs_agents.agents.external:ExternalAgent"

[project.entry-points."nbs_agents.runner"]
claude = "nbs_agents.assistant.claude_runner:plugin"

[project.entry-points."nbs_agents.launchers"]
claude = "nbs_agents.assistant.launcher:claude_launch_parameters"

[project.entry-points."nbs_gui.plans"]
nbs-agents-block = "nbs_agents.qt.plans.agent_block:AgentBlockWidget"

[project.entry-points."nbs_gui.tabs"]
nbs-agents-log = "nbs_agents.qt.tabs.agent_log:AgentLogTab"
nbs-agents-assistant = "nbs_agents.qt.tabs.assistant:AssistantTab"

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
nbs-agents = {path = ".", editable = true}

# The same tasks as sst-assistant's, without SST's specifics
[tool.pixi.tasks]
init = "nbs-agents-assistant init"
check = "nbs-agents-assistant check"
timing = "nbs-agents-assistant timing"
agent-runner = "nbs-agents-assistant runner"
agent-web = "nbs-agents-web"
# The read-only assistant without any Claude agent that drives the beamline
assistant-runner = "nbs-agents-assistant runner --assistant-only"
assistant-web = "nbs-agents-web --assistant-only"
test = "pytest tests"

[tool.pixi.feature.test.dependencies]
pytest = "*"
httpx = "*"

# The [assistant] extra, plus scipy for the agents' sandbox-python
[tool.pixi.feature.assistant.dependencies]
fastapi = "*"
uvicorn = "*"
matplotlib = "*"
pyyaml = "*"
pyepics = "*"
scipy = "*"

# The default environment has the [assistant] extra, so the tasks above work in it
[tool.pixi.environments]
default = {features = ["assistant"], solve-group = "default"}
assistant = {features = ["assistant"], solve-group = "default"}
test = {features = ["test", "assistant"], solve-group = "default"}
