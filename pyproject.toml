[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nbs-agents"
authors = [
    {name = "Charles Titus", email = "ctitus@bnl.gov"},
]
requires-python = ">=3.9"
description = "NBS Agent Framework"
dynamic = ["version"]
readme = "README.md"
keywords = ["bluesky", "nsls-ii", "beamline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research"
]
dependencies = [
    "bluesky",
    "bluesky-queueserver",
    "bluesky-queueserver-api",
    "tiled",
    "numpy",
    "ipython",
    "numpydoc",
    "scikit-learn",
    "matplotlib",
    "numpyro",
    "jax",
    "tinygp",
    "redis",
    "pyzmq",
    'tomli ; python_version < "3.11"'
]

[tool.pixi.dependencies]
bluesky = "*"
bluesky-queueserver = "*"
bluesky-queueserver-api = "*"
tiled = "*"
numpy = "*"
ipython = "*"
numpydoc = "*"
scikit-learn = "*"
matplotlib = "*"
numpyro = "*"
jax = "*"
tinygp = "*"
redis-py = "*"
pyzmq = "*"
qt6-wayland = "*"

[project.urls]
homepage = "https://github.com/xraygui/nbs-agents"

[project.scripts]
nbs-agents-runner = "nbs_agents.runner:main"
nbs-cli = "nbs_agents.cli.main:main"

[project.optional-dependencies]
gui = ["nbs-gui", "qtpy"]

[project.entry-points."nbs_gui.plans"]
nbs-agents-block = "nbs_agents.qt.plans.agent_block:AgentBlockWidget"

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
nbs-agents = {path = ".", editable = true}

[tool.pixi.tasks]
agent-runner = "nbs-agents-runner"
